name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simulate a long test suite
        if: ${{ vars.CI_MINUTES != '' && vars.CI_MINUTES != '0' }}
        run: sleep $(( ${{ vars.CI_MINUTES }} * 60 ))
      - name: Run tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test
          path: junit.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint
        run: npm run lint
